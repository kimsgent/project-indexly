    test_paths: [tests/test_doctor.py, tests/test_extras_cli.py, tests/test_search.py]
    documentation_targets: [DOC-USAGE, DOC-CONFIG, DOC-INSTALL, DOC-DEVELOPER]
    risk_ids: [IDX-RISK-001]
    change_classes: [behavior, documentation]
  IDX-02:
    kind: area
