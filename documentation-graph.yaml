schema_version: 1
graph_id: indexly-documentation-navigation
title: Project-Indexly documentation and release navigation graph
scope: >-
  Cross-platform navigation metadata for agents changing Project-Indexly. It maps
  product areas and high-value modules to focused tests, Hugo documentation, and
  release-metadata work. It is an index, not a replacement for source, tests,
  release contracts, or Codmem's private tracking records.

navigation_contract:
  use_order:
    - Resolve changed paths against module and area source_paths before broad search.
    - Open the mapped source, focused tests, and Hugo documentation targets.
    - For non-trivial work, use the Codmem recall process in AGENTS.md; verify its output against this repository.
    - Follow the release_preparation branch only for a release-preparation assignment.
    - Treat every mapped documentation target as a review obligation, not an automatic edit.
  authority_boundary:
    - Source code, tests, and generated-output contracts are authoritative for behavior.
    - Hugo pages are authoritative for published user-facing guidance.
    - Codmem is private context discovered at runtime; do not copy its defect or risk prose here.
    - This graph cannot authorize a release, publication, destructive operation, or workflow change.
  portability:
    - All paths are repository-relative POSIX paths.
    - Do not require a sibling checkout or a machine-specific absolute path.

vocabulary:
  node_kinds: [area, module, documentation, release_contract, validation, automation, agent_route]
  relationship_types: [belongs_to, documents, requires_review_of, validates, generates, routes_to, requires]
  change_classes: [behavior, documentation, release, packaging, workflow, windows]

hugo:
  content_root: docs/content
  user_documentation_root: docs/content/documentation
  release_content_root: docs/content/releases
  configuration: docs/config/_default/config.toml
  public_language_prefix: /en
  conventions:
    - Preserve existing front matter, slugs, aliases, and relative links unless the behavior change requires them to change.
    - Do not hand-edit generated release indexes or docs/static/releases.json; run scripts/generate_releases.py.
    - A mapped page is reviewed for accuracy; add or edit it only when user-visible behavior, commands, safety, or compatibility changed.

release_preparation:
  task_name: Indexly Release Prep
  task_id: indexly-release-prep
  role: >-
    Existing Codex task/automation. This graph tells agents where release documentation
    lives; it does not amend, invoke, or replace that task.
  local_contract_paths:
    - .codex/skills/skill.md
    - .codex/skills/technical_writer_skill.md
    - .codex/skills/analyst_auditor_skill.md
    - .codex/skills/implementation_reviewer_skill.md
  release_inputs:
    - docs/data/changelog.json
    - docs/content/releases
    - docs/content/documentation/_index.en.md
  generated_outputs:
    - docs/content/releases/_index.en.md
    - docs/content/releases/Archive/_index.en.md
    - docs/static/releases.json
    - docs/content/releases/Archive/
  metadata_requirements:
    - release_id
    - version
    - released_at
    - area_ids
    - risk_ids
    - mapping_confidence
    - source_commit_range
    - change_ids
  required_actions:
    - Pin and inspect the candidate commit range before writing release metadata.
    - Verify area and risk identifiers through Codmem recall; IDs in this graph are navigation hints only.
    - Run scripts/generate_releases.py twice and require the second run to be idempotent.
    - Run scripts/validate_release_metadata.py --release-version vX.Y.Z for the target release.
    - Preserve the task's no-push/no-publish boundary unless that run explicitly authorizes a remote action.
  prohibited_actions:
    - Do not edit the Indexly Release Prep task, automation, or local skill contracts as a consequence of this graph.
    - Do not publish, tag, push, create a pull request, or merge merely because a graph edge reaches a release node.

agent_routing:
  analyst_auditor:
    when: Change impact, documentation impact, area/risk mapping, or release evidence is uncertain.
    actions: [resolve_areas, review_hugo_targets, codmem_recall, report_risks_and_gaps]
  python_developer:
    when: Python behavior, CLI, data, persistence, or test changes are in scope.
    actions: [resolve_modules, run_focused_tests, flag_hugo_targets, preserve_safety_boundaries]
  technical_writer:
    when: Hugo content, README guidance, changelog, release page, or metadata changes are in scope.
    actions: [review_hugo_targets, preserve_hugo_routes, validate_release_metadata_when_applicable]
  implementation_reviewer:
    when: Reviewing a change set or release-preparation result independently.
    actions: [verify_graph_targets_were_considered, inspect_docs_code_test_coherence, check_generated_release_outputs]
  webui_developer:
    when: Hugo/Docsy presentation, navigation, templates, or site build behavior changes.
    actions: [review_hugo_configuration, validate_documentation_routes]
  powershell_developer:
    when: Windows scripts, service templates, setup, or Windows-only behavior changes.
    actions: [review_windows_documentation, preserve_cross_platform_paths]

