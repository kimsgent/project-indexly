<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indexly Quality Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #5f6b7a;
      --line: #d8dee6;
      --accent: #2563eb;
      --good: #15803d;
      --warn: #b45309;
      --bad: #b91c1c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    header,
    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      padding: 28px 0 16px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 18px;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .cards {
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      margin: 18px 0;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }

    .metric {
      font-size: 30px;
      font-weight: 700;
      margin-top: 8px;
    }

    .label {
      color: var(--muted);
      font-size: 13px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 9px 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-weight: 700;
      background: #f3f5f8;
    }

    .status {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 700;
      background: #e8eef8;
      color: var(--accent);
    }

    .bad {
      color: var(--bad);
    }

    .warn {
      color: var(--warn);
    }

    .good {
      color: var(--good);
    }

    .section {
      margin: 18px 0;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 18px;
      color: var(--muted);
      background: #fbfcfe;
    }
  </style>
</head>
<body>
  <header>
    <h1>Indexly Quality Dashboard</h1>
    <p>Static local dashboard for system-test risk coverage metrics.</p>
  </header>

  <main>
    <section class="grid cards" id="summary-cards"></section>

    <section class="panel section">
      <h2>Risk Heatmap</h2>
      <table>
        <thead>
          <tr>
            <th>Area</th>
            <th>Confirmed defects</th>
            <th>Open defects</th>
            <th>Average RPN</th>
            <th>Lowest RPN</th>
            <th>Regressions</th>
          </tr>
        </thead>
        <tbody id="risk-heatmap"></tbody>
      </table>
    </section>

    <section class="grid section" style="grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));">
      <div class="panel">
        <h2>Regression Chains</h2>
        <div id="regression-chains"></div>
      </div>
      <div class="panel">
        <h2>Repeated Risks</h2>
        <div id="repeated-risks"></div>
      </div>
    </section>

    <section class="panel section">
      <h2>Test Evidence</h2>
      <table>
        <tbody id="test-evidence"></tbody>
      </table>
    </section>
  </main>

  <script id="seed-metrics" type="application/json">
{
  "schema": "indexly.tracking.quality_dashboard_metrics.v1",
  "generated_at": "2026-06-02",
  "summary": {
    "total_confirmed_defects": 0,
    "mitigated_confirmed_defects": 0,
    "open_confirmed_defects": 0,
    "mitigation_rate_percent": null,
    "high_risk_open_defects": 0,
    "repeated_risk_count": 0,
    "planned_cases": 0,
    "executed_cases": 0,
    "pass_count": 0,
    "warn_count": 0,
    "fail_count": 0,
    "skip_count": 0,
    "collected_count": 0,
    "test_execution_rate_percent": null,
    "mean_time_to_mitigate_days": null
  },
  "defects_by_area_id": {},
  "open_defects_by_area_id": {},
  "regressions_by_area_id": {},
  "average_rpn_by_area": {},
  "lowest_rpn_by_area": {},
  "repeated_risks": [],
  "regression_chains": []
}
  </script>

  <script>
    const areaIds = [
      "IDX-01", "IDX-02", "IDX-03", "IDX-04", "IDX-05", "IDX-06",
      "IDX-07", "IDX-08", "IDX-09", "IDX-10", "IDX-11", "IDX-12"
    ];

    const fmt = (value) => value === null || value === undefined ? "n/a" : value;
    const pct = (value) => value === null || value === undefined ? "n/a" : `${value}%`;

    async function loadMetrics() {
      const fallback = JSON.parse(document.getElementById("seed-metrics").textContent);
      try {
        const response = await fetch("metrics.json", { cache: "no-store" });
        if (!response.ok) return fallback;
        return await response.json();
      } catch (_) {
        return fallback;
      }
    }

    function renderSummary(metrics) {
      const summary = metrics.summary || {};
      const cards = [
        ["Mitigation rate", pct(summary.mitigation_rate_percent), "mitigated / confirmed"],
        ["Confirmed defects", fmt(summary.total_confirmed_defects), "all tracked defects"],
        ["Open defects", fmt(summary.open_confirmed_defects), "open or in progress"],
        ["Open high-risk", fmt(summary.high_risk_open_defects), "RPN 1-5"],
        ["Test execution", pct(summary.test_execution_rate_percent), "executed / planned"],
        ["Mean mitigation", fmt(summary.mean_time_to_mitigate_days), "days"]
      ];

      document.getElementById("summary-cards").innerHTML = cards.map(([title, value, label]) => `
        <div class="panel">
          <div class="label">${title}</div>
          <div class="metric">${value}</div>
          <div class="label">${label}</div>
        </div>
      `).join("");
    }

    function renderHeatmap(metrics) {
      const defects = metrics.defects_by_area_id || {};
      const open = metrics.open_defects_by_area_id || {};
      const avg = metrics.average_rpn_by_area || {};
      const low = metrics.lowest_rpn_by_area || {};
      const regressions = metrics.regressions_by_area_id || {};

      document.getElementById("risk-heatmap").innerHTML = areaIds.map((area) => `
        <tr>
          <td><strong>${area}</strong></td>
          <td>${fmt(defects[area] || 0)}</td>
          <td>${fmt(open[area] || 0)}</td>
          <td>${fmt(avg[area])}</td>
          <td>${fmt(low[area])}</td>
          <td>${fmt(regressions[area] || 0)}</td>
        </tr>
      `).join("");
    }

    function renderLists(metrics) {
      const chains = metrics.regression_chains || [];
      const risks = metrics.repeated_risks || [];

      document.getElementById("regression-chains").innerHTML = chains.length
        ? `<ul>${chains.map((item) => `<li>${item}</li>`).join("")}</ul>`
        : `<div class="empty">No regression chains recorded yet. Use <code>regression_of</code> in worksheet JSON defects.</div>`;

      document.getElementById("repeated-risks").innerHTML = risks.length
        ? `<ul>${risks.map((item) => `<li>${item.risk_id || item}: ${item.count || ""}</li>`).join("")}</ul>`
        : `<div class="empty">No repeated risks recorded yet. Use <code>related_risk_ids</code> in worksheet JSON defects.</div>`;
    }

    function renderTestEvidence(metrics) {
      const summary = metrics.summary || {};
      const rows = [
        ["Planned", summary.planned_cases],
        ["Executed", summary.executed_cases],
        ["Pass", summary.pass_count],
        ["Warn", summary.warn_count],
        ["Fail", summary.fail_count],
        ["Skip", summary.skip_count],
        ["Collected", summary.collected_count]
      ];

      document.getElementById("test-evidence").innerHTML = rows.map(([label, value]) => `
        <tr><th>${label}</th><td>${fmt(value)}</td></tr>
      `).join("");
    }

    loadMetrics().then((metrics) => {
      renderSummary(metrics);
      renderHeatmap(metrics);
      renderLists(metrics);
      renderTestEvidence(metrics);
    });
  </script>
</body>
</html>
